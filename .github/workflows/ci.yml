# Required checks (project-profile.md §7). Every gate in the Hardening Baseline that can run
# automatically runs here (Core v4, CORE-01/03). Actions pinned to full SHAs (HB-SUP-01).
name: CI

on:
  pull_request:
  push:
    # Working branches are covered by pull_request events (running both doubled CI load).
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  checks:
    name: Step 0, docs, lint, typecheck, unit, SDK size, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Install (lockfile enforced, HB-SUP-02)
        run: pnpm install --frozen-lockfile
      - name: Step 0 validation (D05)
        run: pnpm validate
      - name: Governance docs (ADR supersession, doc IDs)
        run: node tools/check-docs.mjs
      - name: Lint (HB-QUAL-01, HB-SEC-04)
        run: pnpm lint
      - name: Typecheck (HB-QUAL-05)
        run: pnpm typecheck
      - name: Unit tests (HB-QUAL-02)
        run: pnpm test
      - name: SDK size budget (< 15 KB minified)
        run: pnpm --filter @superapp/sdk build && pnpm --filter @superapp/sdk size
      - name: Dependency audit (shipped dependencies, high+, HB-SUP-03)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E + accessibility (Playwright, axe-core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @superapp/shell exec playwright install --with-deps chromium
      - name: E2E (hermetic, HB-QUAL-03, HB-A11Y-01)
        run: pnpm test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: e2e-evidence
          path: |
            apps/shell/test-results/
            apps/shell/playwright-report/
          if-no-files-found: ignore

  pocketbase:
    name: PocketBase integration (migrations, version + idempotency hooks)
    runs-on: ubuntu-24.04
    env:
      PB_SUPERUSER_EMAIL: ci-admin@example.test
      PB_SUPERUSER_PASSWORD: ci-admin-password-123 # throwaway, CI-only data dir
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start pinned PocketBase on a clean data dir
        run: tools/pocketbase-ci.sh
      - name: Integration tests
        run: pnpm --filter @superapp/server test:integration
      - name: PocketBase log
        if: always()
        run: cat server/bin/pocketbase.log || true

  android:
    name: Android debug APK (Writer Deploys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync Capacitor
        run: pnpm build && pnpm --filter @superapp/shell exec cap sync android
      - name: Cache Gradle dependencies (Maven Central throttles repeated downloads)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/shell/android/**/*.gradle', 'apps/shell/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Assemble debug APK (JDK 21, preinstalled Android SDK)
        working-directory: apps/shell/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: superapp-debug-apk
          path: apps/shell/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows-install:
    name: Windows install script (mini PC setup)
    runs-on: windows-2025
    env:
      PB_SUPERUSER_EMAIL: ci-admin@example.test
      PB_SUPERUSER_PASSWORD: ci-admin-password-123 # throwaway, CI-only data dir
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - name: Run tools/install-windows.ps1 (no winget, no service, no Tailscale)
        shell: powershell
        run: .\tools\install-windows.ps1 -InstallDir "$env:RUNNER_TEMP\pocketbase" -SkipTools -SkipTailscale -NoService
      - name: Start the installed PocketBase and run the integration tests against it
        shell: powershell
        run: |
          $dir = "$env:RUNNER_TEMP\pocketbase"
          Start-Process -FilePath "$dir\pocketbase.exe" -ArgumentList @('serve', '--http', '127.0.0.1:8090', '--dir', "$dir\pb_data", '--migrationsDir', "$dir\pb_migrations", '--hooksDir', "$dir\pb_hooks") -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
          for ($i = 0; $i -lt 40; $i++) { try { if ((Invoke-RestMethod http://127.0.0.1:8090/api/health).code -eq 200) { break } } catch { Start-Sleep -Milliseconds 500 } }
          .\tools\sync-subapps.ps1 -Target $dir -NoPull
          $env:SUPRA_SUBAPPS_INBOX = "$dir\subapps_inbox"
          corepack pnpm --filter @superapp/server test:integration
          if ($LASTEXITCODE -ne 0) { Get-Content "$dir\out.log", "$dir\err.log"; exit 1 }

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
