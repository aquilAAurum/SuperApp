<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EatWell</title>
    <style>
      /* EatWell look: calm, card-based, big numbers (in the spirit of Fitbit's Today and LoseIt's
         budget), no ads, no coaching. Colours meet WCAG AA (text 4.5:1, graphics 3:1) in both themes;
         meaning is never colour-only (labels and numbers accompany every bar and ring). */
      :root {
        color-scheme: light;
        --bg: #f3f5f7;
        --surface: #ffffff;
        --surface-2: #eef1f4;
        --text: #12161c;
        --muted: #586170;
        --border: #dfe3e8;
        --accent: #00747a;
        --accent-text: #ffffff;
        --ring: #00868c;
        --track: #e3e8ec;
        --over: #c2410c;
        --danger: #b3261e;
        --protein: #2563c9;
        --carbs: #a16207;
        --fat: #8b3fb0;
        --focus: #1d4ed8;
        --radius: 16px;
        --tap: 48px;
        --nav-h: 64px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0e1114;
        --surface: #171b20;
        --surface-2: #20262c;
        --text: #e8ecf0;
        --muted: #a4adb8;
        --border: #2b3239;
        --accent: #5cd6cb;
        --accent-text: #05302c;
        --ring: #3fc7bb;
        --track: #2a3238;
        --over: #ff8f57;
        --danger: #ffb4ab;
        --protein: #7fb0ff;
        --carbs: #e9b44c;
        --fat: #d39cf0;
        --focus: #9cc2ff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #main { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
      .view, .sheet { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
      h1 { font-size: 1.25rem; margin: 0; }
      h2 { font-size: 1rem; margin: 0; }
      h2.sub { margin-top: 12px; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .small { font-size: 0.875rem; }
      .block { display: block; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .error { color: var(--danger); font-size: 0.875rem; }
      .error:empty { display: none; }

      button, select, input { font: inherit; color: inherit; }
      button { min-height: var(--tap); padding: 0 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
      button.ghost { background: var(--surface-2); border-color: transparent; }
      button.danger { color: var(--danger); background: transparent; }
      button.wide { width: 100%; }
      button.icon { min-width: var(--tap); padding: 0; font-size: 1.25rem; background: transparent; border-color: transparent; }
      button.link { min-height: 0; padding: 0; border: 0; background: none; color: var(--accent); text-decoration: underline; }
      .danger-text { color: var(--danger) !important; }
      button.add { min-height: 40px; padding: 0 14px; border-radius: 999px; color: var(--accent); border-color: var(--accent); background: transparent; font-weight: 600; }
      button.mini { min-height: 36px; min-width: 44px; padding: 0; border-radius: 999px; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      input, select { min-height: var(--tap); padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); width: 100%; }
      input[type='checkbox'] { width: 24px; height: 24px; min-height: 0; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
      input[aria-invalid='true'] { border-color: var(--danger); }
      label { font-weight: 600; font-size: 0.9375rem; }

      .card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); }
      .card-head, .meal-head { display: flex; align-items: center; gap: 8px; }
      .card-head h2, .meal-head h2 { flex: 1; }
      .meal-head h2 { flex: 0 1 auto; }
      .meal-head .muted { flex: 1; font-size: 0.875rem; }

      .daybar { display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); }
      .daybar h1 { flex: 1; text-align: center; }
      .daybar:has(> h1:only-child) h1 { text-align: left; }

      .hero { justify-items: center; text-align: center; }
      .ring-wrap { position: relative; width: 200px; height: 200px; }
      .ring { width: 200px; height: 200px; }
      .ring-track { stroke: var(--track); }
      .ring-fill { stroke: var(--ring); }
      .ring-over { stroke: var(--over); }
      .ring-center { position: absolute; inset: 0; display: grid; place-content: center; }
      .big { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .big.over { color: var(--over); }
      .hero-sm .big { font-size: 2rem; }
      .formula { color: var(--muted); font-variant-numeric: tabular-nums; }
      .formula b { color: var(--text); }
      .hint { font-size: 0.875rem; color: var(--muted); }

      .macros { display: grid; gap: 10px; }
      .macro-top { display: flex; justify-content: space-between; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
      .meter { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
      .meter > span { display: block; height: 100%; border-radius: inherit; }
      .m-protein > span { background: var(--protein); }
      .m-carbs > span { background: var(--carbs); }
      .m-fat > span { background: var(--fat); }

      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .tile { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 2px; align-content: start; }
      .tile-label { font-size: 0.8125rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .tile-value { font-size: 1.375rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .tile-sub { font-size: 0.8125rem; }
      .tile-actions { display: flex; gap: 6px; margin-top: 6px; }
      .tile > button.mini { justify-self: start; margin-top: 6px; }
      .connect { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 12px; padding: 12px; }
      .connect p { font-size: 0.875rem; }

      .entries, .foods, .plain { list-style: none; margin: 0; padding: 0; display: grid; }
      .entries li + li, .foods li + li { border-top: 1px solid var(--border); }
      .entry, .food-pick { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 8px 0; min-height: 56px; }
      .food { display: flex; align-items: center; }
      .food-pick { flex: 1; }
      .entry-main { flex: 1; display: grid; min-width: 0; }
      .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .entry-kcal { font-weight: 600; font-variant-numeric: tabular-nums; }
      .star { color: var(--accent); }
      .chip { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--accent); }
      .empty { padding: 16px 0; }

      .segs { display: flex; gap: 6px; }
      .segs[hidden] { display: none; }
      .seg { flex: 1; min-height: 40px; border-radius: 999px; background: var(--surface); }
      .seg.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

      .sheet-head { display: flex; align-items: center; gap: 4px; min-height: var(--tap); }
      .sheet-head h1 { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .row > select { max-width: 60%; }
      .row.gap > * { flex: 1; }
      .stepper { display: flex; align-items: center; gap: 4px; max-width: 60%; }
      .stepper input { text-align: center; min-width: 0; }
      .stepper select.unit { width: auto; padding: 0 8px; }
      .totals { font-variant-numeric: tabular-nums; }
      .form { display: grid; gap: 12px; }
      .form h2 { margin-top: 8px; }
      .field { display: grid; gap: 4px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .toggle { display: flex; gap: 12px; align-items: flex-start; }
      .toggle label { font-weight: 500; }

      .bars, .line { width: 100%; height: auto; }
      .bar { fill: var(--ring); opacity: 0.75; }
      .bar-current { opacity: 1; }
      .bar-over { fill: var(--over); }
      .target { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
      .grid { stroke: var(--border); stroke-width: 1; }
      .trend { stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
      .dot { fill: var(--accent); }
      .axis { fill: var(--muted); font-size: 11px; }
      .stat-line { font-size: 0.9375rem; color: var(--muted); }

      #nav { flex: none; }
      .tabs { display: flex; height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
      .tab { flex: 1; display: grid; place-content: center; justify-items: center; gap: 2px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 0.75rem; font-weight: 600; min-height: var(--nav-h); }
      .tab-icon { width: 24px; height: 24px; }
      .tab.on { color: var(--accent); }

      #toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 12px); margin: 0 auto; max-width: 520px; padding: 12px 16px; border-radius: 12px; background: var(--text); color: var(--bg); box-shadow: 0 4px 12px rgb(0 0 0 / 0.2); }
      #toast[data-kind='error'] { background: var(--danger); color: #fff; }
      :root[data-theme='dark'] #toast[data-kind='error'] { color: #3b0907; }
      @media (prefers-reduced-motion: no-preference) {
        .meter > span { transition: width 0.2s ease-out; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="main"><p class="muted" role="status">Loading…</p></main>
      <div id="nav"></div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
